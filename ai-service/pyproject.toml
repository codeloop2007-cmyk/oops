[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "codeloop", email = "codeloop2007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.1",
    "langchain>=1.4.6",
    "langchain-google-genai>=4,<5",
